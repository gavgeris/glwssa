<body onload="init()">

    <header>
        <h1 class="name">ΓΛΩΣΣΑ IDE</h1>
        <div class="margin"></div>
        <div class="btn unselectable" id="btn_runstop" onclick="btn_runstop()" title="Εκτέλεση/Διακοπή προγράμματος">
            <span>Run</span>
        </div>
        <div class="btn unselectable" onclick="saveFileName()" title="Αποθήκευση αρχείου">
            <span>Save</span>
        </div>
        <!-- Uncomment when load functionality is ready -->
        <!-- <div class="btn unselectable" onclick="loadFile()" title="Φόρτωση αρχείου">
            <span>Load</span>
        </div> -->

    <main>
		<div style="flex-direction: auto;display: flex;flex-flow: wrap;">
			<textarea id="code_area" aria-label="Περιοχή κώδικα"></textarea>

			<div class="screen_container" role="main" aria-label="Κονσόλα εκτέλεσης">
				<div id="screen" aria-live="polite" aria-label="Αποτελέσματα εκτέλεσης"></div>
				<input
						type="text"
						id="keyboard"
						onkeydown="keyboard_down(event)"
						placeholder="Πληκτρολογήστε εντολή..."
						aria-label="Είσοδος εντολών"
						autocomplete="off"
						spellcheck="false"
				>
			</div>
			<div id="userlist" role="complementary" aria-label="Συνδεδεμένοι χρήστες"></div>
		</div>
    </main>


	<!-- Save Popup -->

	<div class="popup" id="save_popup">
		<div class="popup_window">
			<div class="popup_header">
			<h1 class="unselectable">Αποθήκευση</h1>
			</div>

			<h4 class="unselectable">Όνομα αρχείου:</h4>
			<input type=text id="save_filename" value="πρόγραμμα"></input>

			<a class="popup_btn unselectable" href="#">Cancel</a>
			<div class="popup_btn unselectable" onclick="save()">Save</div>
		</div>
	</div>

	<!-- Load Popup -->
	<div class="popup" id="load_popup">
		<div class="popup_window">
			<div class="popup_header">
			<h1 class="unselectable">Φόρτωση</h1>
			</div>

			<input type=file accept=".txt" id="load_file"></input>

			<a class="popup_btn unselectable" href="#">Cancel</a>
			<div class="popup_btn unselectable" onclick="load()">Load</div>
		</div>
	</div>

</body>

<script>
    function init() {
      //// Initialize Firebase.

      var config = {
		  apiKey: "AIzaSyAAMAVAy6d-hAsbiK74rdhDdj2R-FgO524",
		  authDomain: "firepad-959d7.firebaseapp.com",
		  databaseURL: "https://firepad-959d7.firebaseio.com",
		  projectId: "firepad-959d7",
		  storageBucket: "firepad-959d7.appspot.com",
		  messagingSenderId: "827774846517",
		  appId: "1:827774846517:web:cc1d7e2d267c3af613d37c"
		};
      firebase.initializeApp(config);

      //// Get Firebase Database reference.
      var firepadRef = getExampleRef();

	  // Create a random ID to use as our user ID (we must give this to firepad and FirepadUserList).
      var userId = Math.floor(Math.random() * 9999999999).toString();

      //// Create FirepadUserList (with our desired userId).
      var firepadUserList = FirepadUserList.fromDiv(firepadRef.child('users'),
          document.getElementById('userlist'), userId);

	  //// Create Firepad.
      var firepad = Firepad.fromCodeMirror(firepadRef, editor, {
        defaultText: 'ΠΡΟΓΡΑΜΜΑ ....\nΜΕΤΑΒΛΗΤΕΣ\n  ΑΚΕΡΑΙΕΣ: Ι\nΑΡΧΗ\nΤΕΛΟΣ_ΠΡΟΓΡΑΜΜΑΤΟΣ\n\n', userId: userId
      });
    }

    // Helper to get hash from end of URL or generate a random one.
    function getExampleRef() {
      var ref = firebase.database().ref();
      var hash = window.location.hash.replace(/#/g, '');
      if (hash) {
        ref = ref.child(hash);
      } else {
        ref = ref.push(); // generate unique location.
        window.location = window.location + '#' + ref.key; // add it as a hash to the URL.
      }
      if (typeof console !== 'undefined') {
        console.log('Firebase data: ', ref.toString());
      }
      return ref;
    }

	async function saveFileName() {
		const { value: filename } = await Swal.fire({
		  title: 'Όνομα Αρχείου',
		  input: 'text',
		  inputValue: 'ΠΡΟΓΡΑΜΜΑ',
		  showCancelButton: true,
		  inputValidator: (value) => {
			if (!value) {
			  return 'You need to write something!'
			}
		}
		})
		if (filename) {
			document.getElementById("save_filename").value = filename;
			save();
		}
	}
  </script>
